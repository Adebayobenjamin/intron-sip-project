[defaults]
roles_path = roles
inventory = inventories/beta
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
# Show which tasks are slow. The FreeSWITCH source build makes this useful
# rather than noise — it is the difference between "the play is hung" and
# "the compile is twenty minutes in".
callbacks_enabled = profile_tasks
interpreter_python = auto_silent

# No SSH options here, and no ssh_connection section at all. These hosts have
# no SSH daemon exposed, no port 22 rule in any security group, and no key
# pair attached — `key_name = null` on every aws_instance. The only path in is
# SSM Session Manager.
#
# The connection plugin and its transport settings live in inventory
# group_vars rather than here: they are inventory-shaped (region, bucket,
# instance ids), not controller-shaped, so one ansible.cfg serves every
# environment.

[inventory]
enable_plugins = yaml
