---
########################################################
# LiveKit server. Three containers under one systemd unit.
#
# Overridable per environment in inventories/<env>/group_vars/livekit.yml.
# The values that MUST agree with Terraform are marked; everything else is a
# local choice.
########################################################

livekit_config_root: /etc/intron/livekit

########################################################
# Pinned rather than :latest, deliberately. LiveKit's SIP and agent protocol
# both move, and "the server upgraded itself overnight" is not a debugging
# session anyone wants during a call outage. Bump on purpose, with a plan.
#
# PIN CURRENT, NOT OLD. This was v1.9.1 and that was a mistake worth recording,
# because the failure is specific and unhelpful:
#
#   invalid token: ... proto: unknown field "tags"
#
# The CLIENT signs a token whose roomConfig claim carries a field the SERVER's
# protobuf does not know, and the server rejects the whole token. It reads as
# an authentication problem - wrong key, wrong secret, clock skew - and is
# none of those. It is the server being too old for the client.
#
# The asymmetry to remember: a NEWER server accepts an OLDER client, because
# unknown fields are only rejected in the direction the client is ahead. So
# pinning forward is safe for Intron's agent (their box runs 1.12.0) and
# pinning backward breaks the browser.
########################################################
livekit_server_image: livekit/livekit-server:v1.13.7
livekit_sip_image: livekit/sip:v1.15.0
livekit_redis_image: redis:7-alpine

# Pinned too. It was :latest, which contradicted the paragraph above for no
# reason other than that caddyl4's tags are easy to miss - it publishes
# versioned tags alongside latest.
livekit_caddy_image: livekit/caddyl4:v2.11.3

########################################################
# Ports.
#
# EVERY ONE OF THESE HAS A MATCHING SECURITY GROUP RULE in
# iac/stacks/livekit/_main/security-groups.tf. Terraform opens what these
# bind to, from a different file, and the mismatch does not announce itself:
# the call connects, both participants appear, and there is no audio.
########################################################
livekit_api_port: 7880
livekit_rtc_tcp_port: 7881
livekit_rtc_udp_port_min: 50000
livekit_rtc_udp_port_max: 60000
livekit_turn_udp_port: 3478

# TURN over TLS. Caddy terminates on 443 and proxies here, so this port is
# loopback-only and has no security group rule of its own.
livekit_turn_tls_port: 5349

# The TURN RELAY range — where allocations actually carry media, as distinct
# from livekit_turn_udp_port where they are requested. Opening only the request
# port produces a TURN server that negotiates fine and relays into a dropped
# port, failing for exactly the clients that needed TURN.
livekit_turn_relay_port_min: 30000
livekit_turn_relay_port_max: 40000

########################################################
# livekit-sip — where a phone call becomes a room participant.
#
# These ports are reached ONLY from our Kamailio edge, inside this VPC. The
# security group takes the edge security group as its source rather than a
# CIDR, which is what removed the SIP-TLS and SRTP questions entirely — they
# existed because the leg used to cross the public internet.
#
# MUST MATCH sip_port and sip_rtp_port_* in
# iac/stacks/livekit/_main/variables.tf.
########################################################
livekit_sip_enabled: true
livekit_sip_listen_port: 5060

# SIP-side RTP. A DIFFERENT RANGE from livekit_rtc_udp_port_*: that one
# carries WebRTC to browsers and agents, this one carries plain RTP to and
# from RTPEngine. Sharing one range gives audio in one direction only.
livekit_sip_rtp_port_min: 10000
livekit_sip_rtp_port_max: 20000

########################################################
# The inbound trunk and dispatch rule.
#
# These are LiveKit API OBJECTS, not config files — closer to database rows
# than to livekit.yaml. They are created with the lk CLI and are the reason
# an inbound call has a room to land in at all. Intron's deployment has
# neither, which is why it has never accepted an inbound call.
########################################################
livekit_cli_version: "2.18.7"
livekit_sip_trunk_name: intron-sip-inbound
livekit_sip_dispatch_rule_name: intron-sip-inbound

########################################################
# ROOM NAME PREFIX — A CONTRACT WITH INTRON'S AGENT CODE, NOT A LABEL.
#
# Their agent does `str(room_name).split("__")` and takes element [1] as the
# caller's number. So the dispatch rule must produce:
#
#     <prefix>__<caller E.164>
#
# Get this wrong and the agent still answers, but SESSION_PHONE_NUMBER is
# "unknown" and every downstream lookup keyed on the caller silently misses.
# Nothing errors.
#
# The cleaner shape is dispatch metadata, which their code already reads on
# the outbound path — but populating it for inbound needs a change in their
# repo. This matches what their code does today and costs them nothing.
########################################################
livekit_sip_room_prefix: intron_sip

# Their worker registers under this name, and agent_name being set means
# automatic dispatch is OFF — the rule must name the agent explicitly or the
# caller lands in a room with nobody in it.
livekit_sip_agent_name: intron_convobot_agent_2

########################################################
# Secrets Manager container holding LIVEKIT_API_KEY and LIVEKIT_API_SECRET.
#
# Fetched at EVERY service start by the unit's ExecStartPre, so a rotated
# secret is picked up by `systemctl restart` with no Ansible run and nothing
# resolved ever reaches this repo or the S3 transport bucket.
########################################################
livekit_secret_id: "intron-sip/{{ env_name }}/livekit"

########################################################
# How long a room stays open after the last participant leaves.
#
# 3 seconds, not the 20-second default. Intron hit this on their own
# deployment: at 20s a caller who hangs up leaves the room alive, the agent
# keeps its session, and the result is ~20s of dead air plus inflated session
# durations in the call record. Short enough to end cleanly, long enough to
# survive a brief reconnect.
########################################################
livekit_room_departure_timeout: 3

# info, not debug. Intron's SIP container runs at debug and its logs are
# dominated by per-packet ICE and SCTP lines, which is exactly what you do not
# want to page through at 2am looking for a room event.
livekit_log_level: info
