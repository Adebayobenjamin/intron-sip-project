########################################################
# beta inventory — EC2 hosts addressed by SSM instance ID.
#
# EVERY `i-...` BELOW IS A PLACEHOLDER until the stacks are applied.
#
# Regenerate rather than hand-edit. Both stacks emit a paste-ready fragment:
#
#   cd infra/iac
#   make output STACK=sip-core      ENV=beta TOKEN=<6-digit> EXTRA="-raw ansible_inventory_hint"
#   make output STACK=control-plane ENV=beta TOKEN=<6-digit> EXTRA="-raw ansible_inventory_hint"
#
# Do that after ANY apply that replaced an instance. A stale ID fails with a
# message about an instance not being found, which points at SSM rather than
# at this file.
#
# EACH HOST CARRIES TWO ADDRESS-LIKE FIELDS AND THEY ARE NOT INTERCHANGEABLE:
#
#   ansible_host                  the private IP. Used INSIDE rendered configs —
#                                 what Kamailio binds to, what goes in the
#                                 dispatcher list, what FreeSWITCH advertises
#                                 on the private side.
#   ansible_aws_ssm_instance_id   how Ansible REACHES the box. Not routable
#                                 from a laptop at all; it goes via the SSM
#                                 data plane.
#
# Mixing them up produces a play that either cannot connect or renders a config
# full of instance IDs. Both are obvious; neither is obvious at 2am.
########################################################
all:
  children:
    ####################################################
    # EDGE — Kamailio + RTPEngine on one box.
    #
    # kamailio_public_ip is per-host, not in group_vars, and that matters: with
    # more than one edge node each has its OWN Elastic IP, and a group-level
    # value would silently give both the same one. Kamailio would then
    # advertise an address that belongs to the other node and half the calls
    # would have no audio.
    #
    # The instance cannot discover this address itself — AWS maps the EIP 1:1
    # at the VPC edge and the OS only ever sees 10.70.0.10. It has to come from
    # Terraform.
    ####################################################
    edge:
      hosts:
        beta-edge-1:
          ansible_host: 10.70.0.10
          ansible_aws_ssm_instance_id: i-007b34b5adb18b905
          kamailio_node_id: 1
          kamailio_public_ip: 63.182.163.164

    ####################################################
    # FREESWITCH FARM — private, no public address.
    #
    # One node for beta. Kamailio's dispatcher list is rendered from this
    # group, so adding a node is a Terraform count plus a re-run of the
    # kamailio play — nothing here is written twice.
    ####################################################
    freeswitch:
      hosts:
        beta-freeswitch-1:
          ansible_host: 10.70.20.20
          ansible_aws_ssm_instance_id: i-0afe456580e9b1722
          freeswitch_node_id: 1
          # Nitro instances expose EBS as NVMe and ignore the /dev/sdf the
          # attachment asked for, so the role finds the recordings volume by
          # matching this ID against the NVMe serial rather than by path.
          recordings_volume_id: vol-04d3f614923300c93

    ####################################################
    # CONTROL PLANE — ESL controller + REST API on one box.
    #
    # ONE node, no load balancer. FreeSWITCH resolves
    # esl.beta.intron.internal straight to this address, so a restart ends the
    # calls this node is holding — see iac/stacks/control-plane/_main/dns.tf
    # for why that trade was taken.
    ####################################################
    control_plane:
      hosts:
        beta-app-1:
          ansible_host: 10.70.10.10
          ansible_aws_ssm_instance_id: i-080e89c0c869e0b32
          app_node_id: 1

    ####################################################
    # LIVEKIT — the AI leg, in our own account.
    #
    # In the PUBLIC subnet alongside the edge, because a browser, Intron's
    # agent in another AWS account, and WebRTC media all have to reach it
    # directly. Isolation from Kamailio is the security group, not the subnet.
    #
    # livekit_public_ip is per-host for the same reason kamailio_public_ip is:
    # the instance cannot discover it — AWS maps the Elastic IP 1:1 at the VPC
    # edge and the OS only ever holds 10.70.0.30. LiveKit works around that by
    # querying STUN at startup, and this value is what lets the play check what
    # it discovered against what AWS actually assigned.
    #
    # PLACEHOLDERS until `make apply STACK=livekit ENV=beta`. Regenerate with:
    #   cd infra/iac
    #   make output STACK=livekit ENV=beta EXTRA="-raw ansible_inventory_hint"
    ####################################################
    livekit:
      hosts:
        beta-livekit-1:
          ansible_host: 10.70.0.30
          ansible_aws_ssm_instance_id: i-018575f730b723f87
          livekit_public_ip: 3.69.195.246

    ####################################################
    # TEST PBX — scaffolding, not a platform tier.
    #
    # A disposable Asterisk box standing in for a client's contact-centre SBC,
    # so the human-handoff leg can be exercised before a real one exists. Not
    # in site.yml and not in any convenience group; `make play
    # PLAYBOOK=test-pbx` addresses it directly.
    #
    # IT IS REACHED OVER THE PUBLIC INTERNET even though it sits in this VPC.
    # The edge addresses it by test_pbx_public_ip, so the traffic leaves via
    # the internet gateway and comes back - which is the only way to exercise
    # the address rewriting that a real SBC would expose. Ansible still reaches
    # it privately over SSM, hence both addresses here.
    #
    # EMPTY UNTIL `make apply STACK=test-pbx ENV=beta`. Fill from:
    #   cd infra/iac
    #   make output STACK=test-pbx ENV=beta EXTRA="-raw ansible_inventory_hint"
    #
    # Destroy the stack when the real SBC arrives and delete this block with
    # it - a group pointing at an instance that no longer exists fails a play
    # with an SSM error that names neither.
    ####################################################
    test_pbx:
      hosts:
        beta-test-pbx-1:
          ansible_host: 10.70.0.226
          ansible_aws_ssm_instance_id: i-0cca9ddded7c4dfb0
          # Asterisk cannot see this address - the OS holds only the private
          # one. It is rendered into pjsip.conf as external_media_address and
          # external_signaling_address; get it wrong and the call sets up
          # cleanly with no audio.
          test_pbx_public_ip: 63.180.136.135

    ####################################################
    # Convenience groups. `sip` is the set that gets the VoIP network-buffer
    # tuning and nothing else does — the app tier has no UDP burst to absorb.
    #
    # LIVEKIT IS NOT IN `sip`. It carries WebRTC, not SIP: no UDP burst of the
    # kind that tuning targets, and it runs Docker, which the tuning does not
    # account for. It joins when livekit-sip lands on it, not before.
    ####################################################
    sip:
      children:
        edge:
        freeswitch:
